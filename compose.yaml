services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pensabot
      POSTGRES_USER: pensabot
      POSTGRES_PASSWORD: pensabot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensabot -d pensabot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
