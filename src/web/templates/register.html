{% extends "base.html" %}

{% block title %}Create account — pensabot{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <a href="/" class="logo" style="display:inline-block; margin-bottom:1.75rem;">pensabot</a>
        <h2>Create account</h2>
        <p class="auth-sub">Start remembering everything</p>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">Create account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</div>
{% endblock %}
